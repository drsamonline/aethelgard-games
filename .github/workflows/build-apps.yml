name: Build portable EXE + Android APK

# Drop this file into a consuming app repo as
# .github/workflows/build-apps.yml (repo: aethelgard-games).
#
# Multi-app repo: one matrix entry per game. For each entry,
#   APP_NAME -> asset names: <APP_NAME>-portable.exe and <APP_NAME>.apk
#   APP_SRC  -> folder in the app repo that holds index.html (+ any assets)
# Every entry's EXE and APK are published together on the single
# fixed-tag `app-latest` release.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KIT_REPO: drsamonline/app-builder

jobs:
  exe:
    name: Build portable EXE (Windows) [${{ matrix.name }}]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aethelgard-games-books
            src: docs/play/books
          - name: aethelgard-games-chronicles
            src: docs/play/chronicles
    env:
      APP_NAME: ${{ matrix.name }}
      APP_SRC: ${{ matrix.src }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: Checkout app-builder kit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KIT_REPO }}
          path: builder

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Stage app into the launcher
        shell: bash
        run: |
          rm -rf builder/exe/app
          mkdir -p builder/exe/app
          cp -r "app-repo/${{ env.APP_SRC }}/." builder/exe/app/

      - name: Build portable EXE
        shell: bash
        run: python builder/exe/build.py

      - name: Collect EXE
        shell: bash
        run: |
          mkdir -p out
          cp "builder/exe/dist/${{ env.APP_NAME }}-portable.exe" "out/${{ env.APP_NAME }}-portable.exe"
          ls -la out

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-exe-${{ matrix.name }}
          path: out/${{ env.APP_NAME }}-portable.exe

  apk:
    name: Build Android APK [${{ matrix.name }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aethelgard-games-books
            src: docs/play/books
          - name: aethelgard-games-chronicles
            src: docs/play/chronicles
    env:
      APP_NAME: ${{ matrix.name }}
      APP_SRC: ${{ matrix.src }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: Checkout app-builder kit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KIT_REPO }}
          path: builder

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Stage app into Android assets
        run: |
          rm -rf builder/apk/app/src/main/assets/www
          mkdir -p builder/apk/app/src/main/assets/www
          cp -r "app-repo/${{ env.APP_SRC }}/." builder/apk/app/src/main/assets/www/
          sed -i "s/APP_NAME_PLACEHOLDER/${{ env.APP_NAME }}/g" builder/apk/app/src/main/res/values/strings.xml
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK" > builder/apk/local.properties

      - name: Build signed release APK
        working-directory: builder/apk
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/builder/keystore/debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp builder/apk/app/build/outputs/apk/release/app-release.apk "out/${{ env.APP_NAME }}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.name }}
          path: out/${{ env.APP_NAME }}.apk

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [exe, apk]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la dist

      - name: Delete any existing app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Publish release with fixed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create app-latest \
            --repo "${{ github.repository }}" \
            --title "Latest app build" \
            --notes "Automated build of the portable EXEs and Android APKs from ${{ github.sha }}." \
            dist/*
