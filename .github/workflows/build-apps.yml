# Multi-app repo: one matrix entry per app. Build + release + deploy, one push.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: LicenseRef-Forge-Proprietary
#
# FIXED, and it had three bugs:
#   1. it carried the drifted inline copy, including `if: always()` on the release
#      job, which DELETED the release before recreating it;
#   2. its matrix declared `name` but never `src`, while the build read
#      `${{ matrix.src }}`, so APP_SRC was EMPTY and every app was staged from
#      the repo root;
#   3. both matrix entries published to the SAME release tag, so whichever
#      finished last overwrote the other's assets.
# Each app now gets its own tag (app-latest-<app>) and the demo deploys once.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aethelgard-games-books
            src: docs/play/books
          - name: aethelgard-games-chronicles
            src: docs/play/chronicles
    uses: drsamonline/app-builder/.github/workflows/build.yml@main
    timeout-minutes: 30
    with:
      app_name: ${{ matrix.name }}
      app_src: ${{ matrix.src }}
      release_tag: app-latest-${{ matrix.name }}
      deploy_path: ""
    permissions:
      contents: write
      pages: write
      id-token: write

  pages:
    name: Deploy the demo
    if: github.event_name != 'pull_request'
    uses: drsamonline/app-builder/.github/workflows/pages.yml@main
    timeout-minutes: 30
    with:
      path: docs
    permissions:
      contents: read
      pages: write
      id-token: write
